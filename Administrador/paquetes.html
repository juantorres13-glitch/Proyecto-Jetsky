<div class="section-header">
  <div>
    <h1 class="page-title">Gestión de Paquetes</h1>
    <p class="page-subtitle">Administra los paquetes turísticos disponibles</p>
  </div>
  <button type="button" class="btn btn-primary" id="btn-nuevo-paquete">
    Nuevo Paquete
  </button>
</div>

<div class="stats-grid">
  <div class="stat-card stat-blue">
    <p class="stat-label text-white-opacity">Total Paquetes</p>
    <p class="stat-value text-white" id="stat-total-paquetes">0</p>
  </div>

  <div class="stat-card">
    <p class="stat-label text-muted">Disponibles</p>
    <p class="stat-value" id="stat-disponibles">0</p>
  </div>

  <div class="stat-card stat-border-blue">
    <p class="stat-label text-blue">Destinos</p>
    <p class="stat-value text-blue" id="stat-destinos">0</p>
  </div>

  <div class="stat-card stat-gradient">
    <p class="stat-label text-white-opacity">Promedio</p>
    <p class="stat-value text-white" id="stat-precio-promedio">$0</p>
  </div>
</div>

<div class="search-container">
  <input
    type="text"
    class="search-input"
    id="search-paquetes"
    placeholder="Buscar por nombre o destino..."
  >
</div>

<div id="paquetes-grid" class="cards-grid"></div>

<div id="modal-paquete" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modal-paquete-titulo" class="page-title" style="font-size: 1.25rem;">Nuevo Paquete</h2>
      <button type="button" class="btn btn-outline" id="btn-cerrar-modal-paquete">
        Cerrar
      </button>
    </div>

    <form id="form-paquete">
      <input type="hidden" id="paquete-id">

      <div class="form-grid">
        <div class="form-group" style="grid-column: span 2;">
          <label for="paquete-nombre" class="form-label">Nombre del Paquete *</label>
          <input type="text" id="paquete-nombre" class="form-input" required>
        </div>

        <div class="form-group" style="grid-column: span 2;">
          <label for="paquete-destino" class="form-label">Destino *</label>
          <input type="text" id="paquete-destino" class="form-input" required>
        </div>

        <div class="form-group">
          <label for="paquete-duracion" class="form-label">Duración (días) *</label>
          <input type="number" id="paquete-duracion" class="form-input" min="1" required>
        </div>

        <div class="form-group">
          <label for="paquete-precio" class="form-label">Precio *</label>
          <input type="number" id="paquete-precio" class="form-input" min="0" required>
        </div>

        <div class="form-group">
          <label for="paquete-disponibilidad" class="form-label">Disponibilidad *</label>
          <input type="number" id="paquete-disponibilidad" class="form-input" min="0" required>
        </div>

        <div class="form-group">
          <label for="paquete-rating" class="form-label">Rating</label>
          <input type="number" id="paquete-rating" class="form-input" min="0" max="5" step="0.1">
        </div>

        <div class="form-group" style="grid-column: span 2;">
          <label for="paquete-descripcion" class="form-label">Descripción *</label>
          <textarea id="paquete-descripcion" class="form-input" rows="4" required></textarea>
        </div>

        <div class="form-group" style="grid-column: span 2;">
          <label for="paquete-incluye" class="form-label">Incluye *</label>
          <input
            type="text"
            id="paquete-incluye"
            class="form-input"
            placeholder="Ej: Vuelos, Hotel, Desayuno, Tours"
            required
          >
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline" id="btn-cancelar-modal-paquete">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btn-guardar-paquete">Guardar Paquete</button>
      </div>
    </form>
  </div>
</div>
