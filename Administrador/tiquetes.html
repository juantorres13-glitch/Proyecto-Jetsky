<div class="section-header">
  <div>
    <h1 class="page-title">Gestión de Tiquetes</h1>
    <p class="page-subtitle">Administra los tiquetes de tus clientes</p>
  </div>
  <button type="button" class="btn btn-primary" id="btn-nuevo-tiquete">
    Nuevo Tiquete
  </button>
</div>

<div class="stats-grid">
  <div class="stat-card stat-blue">
    <p class="stat-label text-white-opacity">Total Tiquetes</p>
    <p class="stat-value text-white" id="stat-total-tiquetes">0</p>
  </div>

  <div class="stat-card">
    <p class="stat-label text-muted">Económica</p>
    <p class="stat-value" id="stat-economica">0</p>
  </div>

  <div class="stat-card stat-border-blue">
    <p class="stat-label text-blue">Ejecutiva</p>
    <p class="stat-value text-blue" id="stat-ejecutiva">0</p>
  </div>

  <div class="stat-card stat-gradient">
    <p class="stat-label text-white-opacity">Primera</p>
    <p class="stat-value text-white" id="stat-primera">0</p>
  </div>
</div>

<div class="search-container">
  <input
    type="text"
    class="search-input"
    id="search-tiquetes"
    placeholder="Buscar por cliente, origen o destino..."
  >
</div>

<div id="tiquetes-grid" class="cards-grid"></div>

<div id="modal-tiquete" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modal-tiquete-titulo" class="page-title" style="font-size: 1.25rem;">Nuevo Tiquete</h2>
      <button type="button" class="btn btn-outline" id="btn-cerrar-modal-tiquete">
        Cerrar
      </button>
    </div>

    <form id="form-tiquete">
      <input type="hidden" id="tiquete-id">

      <div class="form-grid">
        <div class="form-group" style="grid-column: span 2;">
          <label for="tiquete-numero" class="form-label">Número de Tiquete *</label>
          <input type="text" id="tiquete-numero" class="form-input" required>
        </div>

        <div class="form-group" style="grid-column: span 2;">
          <label for="tiquete-cliente" class="form-label">Cliente *</label>
          <input type="text" id="tiquete-cliente" class="form-input" required>
        </div>

        <div class="form-group">
          <label for="tiquete-origen" class="form-label">Origen *</label>
          <input type="text" id="tiquete-origen" class="form-input" required>
        </div>

        <div class="form-group">
          <label for="tiquete-destino" class="form-label">Destino *</label>
          <input type="text" id="tiquete-destino" class="form-input" required>
        </div>

        <div class="form-group">
          <label for="tiquete-fecha" class="form-label">Fecha de Vuelo *</label>
          <input type="date" id="tiquete-fecha" class="form-input" required>
        </div>

        <div class="form-group">
          <label for="tiquete-hora" class="form-label">Hora de Vuelo *</label>
          <input type="time" id="tiquete-hora" class="form-input" required>
        </div>

        <div class="form-group">
          <label for="tiquete-clase" class="form-label">Clase</label>
          <select id="tiquete-clase" class="form-input">
            <option value="economica">Económica</option>
            <option value="ejecutiva">Ejecutiva</option>
            <option value="primera">Primera</option>
          </select>
        </div>

        <div class="form-group">
          <label for="tiquete-precio" class="form-label">Precio *</label>
          <input type="number" id="tiquete-precio" class="form-input" min="0" required>
        </div>

        <div class="form-group">
          <label for="tiquete-puerta" class="form-label">Puerta *</label>
          <input type="text" id="tiquete-puerta" class="form-input" required>
        </div>

        <div class="form-group">
          <label for="tiquete-asiento" class="form-label">Asiento *</label>
          <input type="text" id="tiquete-asiento" class="form-input" required>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline" id="btn-cancelar-modal-tiquete">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btn-guardar-tiquete">Guardar Tiquete</button>
      </div>
    </form>
  </div>
</div>
