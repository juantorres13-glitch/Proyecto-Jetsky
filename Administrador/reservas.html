<div class="section-header">
  <div>
    <h1 class="page-title">Gestión de Reservas</h1>
    <p class="page-subtitle">Administra las reservas de tus clientes</p>
  </div>
  <button type="button" class="btn btn-primary" id="btn-nueva-reserva">
    Nueva Reserva
  </button>
</div>

<div class="stats-grid">
  <div class="stat-card stat-blue">
    <p class="stat-label text-white-opacity">Total Reservas</p>
    <p class="stat-value text-white" id="stat-total-reservas">0</p>
  </div>

  <div class="stat-card">
    <p class="stat-label text-muted">Pendientes</p>
    <p class="stat-value" id="stat-pendientes">0</p>
  </div>

  <div class="stat-card stat-border-blue">
    <p class="stat-label text-blue">Confirmadas</p>
    <p class="stat-value text-blue" id="stat-confirmadas">0</p>
  </div>

  <div class="stat-card stat-gradient">
    <p class="stat-label text-white-opacity">Ingresos</p>
    <p class="stat-value text-white" id="stat-ingresos">$0</p>
  </div>
</div>

<div class="search-container">
  <input
    type="text"
    class="search-input"
    id="search-reservas"
    placeholder="Buscar por cliente o destino..."
  >
</div>

<div id="reservas-grid" class="cards-grid"></div>

<div id="modal-reserva" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modal-reserva-titulo" class="page-title" style="font-size: 1.25rem;">Nueva Reserva</h2>
      <button type="button" class="btn btn-outline" id="btn-cerrar-modal-reserva">
        Cerrar
      </button>
    </div>

    <form id="form-reserva">
      <input type="hidden" id="reserva-id">

      <div class="form-grid">
        <div class="form-group" style="grid-column: span 2;">
          <label for="reserva-cliente" class="form-label">Cliente *</label>
          <input type="text" id="reserva-cliente" class="form-input" required>
        </div>

        <div class="form-group" style="grid-column: span 2;">
          <label for="reserva-destino" class="form-label">Destino *</label>
          <input type="text" id="reserva-destino" class="form-input" required>
        </div>

        <div class="form-group">
          <label for="reserva-salida" class="form-label">Fecha de salida *</label>
          <input type="date" id="reserva-salida" class="form-input" required>
        </div>

        <div class="form-group">
          <label for="reserva-regreso" class="form-label">Fecha de regreso *</label>
          <input type="date" id="reserva-regreso" class="form-input" required>
        </div>

        <div class="form-group">
          <label for="reserva-pasajeros" class="form-label">Pasajeros *</label>
          <input type="number" id="reserva-pasajeros" class="form-input" min="1" required>
        </div>

        <div class="form-group">
          <label for="reserva-estado" class="form-label">Estado</label>
          <select id="reserva-estado" class="form-input">
            <option value="pendiente">Pendiente</option>
            <option value="confirmada">Confirmada</option>
            <option value="cancelada">Cancelada</option>
          </select>
        </div>

        <div class="form-group">
          <label for="reserva-total" class="form-label">Total *</label>
          <input type="number" id="reserva-total" class="form-input" min="0" required>
        </div>

        <div class="form-group">
          <label for="reserva-imagen" class="form-label">URL imagen</label>
          <input type="text" id="reserva-imagen" class="form-input">
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline" id="btn-cancelar-modal-reserva">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btn-guardar-reserva">Guardar Reserva</button>
      </div>
    </form>
  </div>
</div>
