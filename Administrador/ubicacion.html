<div class="section-header">
  <div>
    <h1 class="page-title">Gestión de Cuentas</h1>
    <p class="page-subtitle">Administra las cuentas existentes por rol</p>
  </div>
  <button type="button" class="btn btn-primary" id="btn-nueva-cuenta">
    Nueva Cuenta
  </button>
</div>

<div class="stats-grid">
  <div class="stat-card stat-blue">
    <p class="stat-label text-white-opacity">Total Cuentas</p>
    <p class="stat-value text-white" id="stat-total-cuentas">0</p>
  </div>

  <div class="stat-card">
    <p class="stat-label text-muted">Clientes</p>
    <p class="stat-value" id="stat-clientes">0</p>
  </div>

  <div class="stat-card stat-border-blue">
    <p class="stat-label text-blue">Operarios</p>
    <p class="stat-value text-blue" id="stat-operarios">0</p>
  </div>

  <div class="stat-card stat-gradient">
    <p class="stat-label text-white-opacity">Administradores</p>
    <p class="stat-value text-white" id="stat-administradores">0</p>
  </div>
</div>

<div class="search-container">
  <input
    type="text"
    class="search-input"
    id="search-cuentas"
    placeholder="Buscar por nombre, correo o rol..."
  >
</div>

<div id="cuentas-grid" class="cards-grid"></div>

<div id="modal-cuenta" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modal-cuenta-titulo" class="page-title" style="font-size: 1.25rem;">Nueva Cuenta</h2>
      <button type="button" class="btn btn-outline" id="btn-cerrar-modal-cuenta">
        Cerrar
      </button>
    </div>

    <form id="form-cuenta">
      <input type="hidden" id="cuenta-id">

      <div class="form-grid">
        <div class="form-group" style="grid-column: span 2;">
          <label for="cuenta-nombre" class="form-label">Nombre Completo *</label>
          <input type="text" id="cuenta-nombre" class="form-input" required>
        </div>

        <div class="form-group" style="grid-column: span 2;">
          <label for="cuenta-email" class="form-label">Correo Electrónico *</label>
          <input type="email" id="cuenta-email" class="form-input" required>
        </div>

        <div class="form-group">
          <label for="cuenta-rol" class="form-label">Rol *</label>
          <select id="cuenta-rol" class="form-input" required>
            <option value="cliente">Cliente</option>
            <option value="operario">Operario</option>
            <option value="administrador">Administrador</option>
          </select>
        </div>

        <div class="form-group">
          <label for="cuenta-estado" class="form-label">Estado *</label>
          <select id="cuenta-estado" class="form-input" required>
            <option value="activa">Activa</option>
            <option value="inactiva">Inactiva</option>
          </select>
        </div>

        <div class="form-group" style="grid-column: span 2;">
          <label for="cuenta-telefono" class="form-label">Teléfono</label>
          <input type="text" id="cuenta-telefono" class="form-input">
        </div>

        <div class="form-group" style="grid-column: span 2;">
          <label for="cuenta-password" class="form-label">Contraseña *</label>
          <input type="text" id="cuenta-password" class="form-input" required>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline" id="btn-cancelar-modal-cuenta">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btn-guardar-cuenta">Guardar Cuenta</button>
      </div>
    </form>
  </div>
</div>
